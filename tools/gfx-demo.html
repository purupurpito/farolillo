<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Farolillo · prueba de gráficos</title>
<style>
  :root { --mar-900:#14213d; --mar-700:#1f3a5f; --arena-100:#f6efe0; --farol-400:#ffb547; --farol-600:#e07a1f; --texto:#1b1b1f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--mar-900); color: var(--arena-100); font: 14px/1.35 system-ui, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 8px 12px 40px; }
  h1 { font-size: 17px; margin: 4px 0 8px; color: var(--farol-400); }
  h2 { font-size: 14px; margin: 14px 0 4px; }
  canvas { display: block; width: 100%; border: 2px solid #000; background: var(--mar-700); image-rendering: pixelated; }
  #cala { height: 46vh; min-height: 180px; max-height: 300px; }
  #combate { height: 130px; }
  #ficha { height: 220px; }
  #fx { height: 220px; }
  .fila { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
  button, select, label { min-height: 44px; font: inherit; }
  button, select { background: var(--farol-600); color: var(--arena-100); border: 2px solid #000; padding: 0 12px; border-radius: 0; }
  select { background: var(--mar-700); }
  label { display: inline-flex; align-items: center; gap: 4px; }
  #log { font: 12px ui-monospace, monospace; color: #9fb4cc; min-height: 1.4em; }
  @media (orientation: landscape) and (max-height: 500px) {
    .lado { display: grid; grid-template-columns: 60% 40%; gap: 10px; }
    #cala { height: 70vh; }
  }
</style>
</head>
<body>
<main>
  <h1>Farolillo · prueba de gráficos</h1>
  <div id="log">Cargando…</div>
  <div class="lado">
    <section>
      <h2>Cala (arrastra ⇆, toca a un vecino)</h2>
      <canvas id="cala"></canvas>
      <div class="fila">
        <label><input type="checkbox" id="noche"> Noche</label>
        <button id="masVecinos">+ vecinos</button>
        <button id="visita">Visitante</button>
      </div>
    </section>
    <section>
      <h2>Expedición en curso</h2>
      <canvas id="combate"></canvas>
      <div class="fila">
        <button id="nuevaExp">Nueva expedición</button>
        <button id="rapido">×20 velocidad</button>
      </div>
    </section>
  </div>
  <h2>Ficha</h2>
  <canvas id="ficha"></canvas>
  <div class="fila">
    <select id="esp"></select>
    <label><input type="checkbox" id="vr"> Variocolor</label>
    <button id="ant">◀</button><span id="nomAnim">Idle</span><button id="sig">▶</button>
  </div>
  <h2>Efectos</h2>
  <canvas id="fx"></canvas>
  <div class="fila">
    <button id="evo">Evolución</button>
    <button id="vario">Variocolor</button>
    <button id="compartir">Captura</button>
  </div>
</main>
<script type="module">
import * as S from '../js/gfx/sprites.js';
import * as Cala from '../js/gfx/scene-cala.js';
import * as Combate from '../js/gfx/scene-combate.js';
import * as Ficha from '../js/gfx/scene-ficha.js';
import * as fx from '../js/gfx/fx.js';

const $ = id => document.getElementById(id);
const log = t => { $('log').textContent = t; };
const q = new URLSearchParams(location.search);

// Manifest real si existe; si no, el mini-manifest de prueba de GRÁFICOS.
let base = q.get('assets');
if (!base) base = (await fetch('../assets/manifest.json', { method: 'HEAD' }).then(r => r.ok).catch(() => false)) ? '../assets/' : '../test/fixtures/gfx/';
await S.iniciar(base);
const lista = S.especies();
log(`${lista.length} especies · assets: ${base}`);

// Reloj de la demo (permite forzar noche y acelerar).
let forzarNoche = false, vel = 1, t0Real = Date.now(), t0Juego = Date.now();
const reloj = () => {
  const t = t0Juego + (Date.now() - t0Real) * vel;
  if (!forzarNoche) return t;
  const d = new Date(t); d.setHours(23, 30); return d.getTime() + (t % 60000);
};

// ---- Cala
const frases = ['¡Qué buen día para pescar!', 'El faro brilla más que nunca.', '¿Salimos de expedición?', 'Me encanta esta cala.', 'Zzz… ¡ah, hola!'];
const cala = Cala.crear($('cala'), { reloj });
let nVec = Math.min(8, lista.length);
const vecinos = () => Array.from({ length: nVec }, (_, i) => ({ uid: 'm_' + i, sp: lista[i % lista.length], vr: i === 3, fav: i < 2 }));
cala.actualizar({ vecinos: vecinos(), farolillos: 7, dorados: 1, visitante: null });
cala.alTocar(info => {
  log('cala: ' + JSON.stringify(info));
  if (info.tipo === 'vecino') setTimeout(() => cala.reaccionar(info.uid, { frase: frases[Math.random() * frases.length | 0], emocion: 'Happy' }), 60);
});
$('noche').onchange = e => { forzarNoche = e.target.checked; };
$('masVecinos').onclick = () => { nVec = Math.min(16, nVec + 4); cala.actualizar({ vecinos: vecinos() }); log(nVec + ' vecinos (máx. 12 animados)'); };
let hayVisita = false;
$('visita').onclick = () => { hayVisita = !hayVisita; cala.actualizar({ visitante: hayVisita ? { sp: lista[lista.length - 1] } : null }); if (hayVisita) cala.centrarEn('muelle'); };

// ---- Combate: registro real de sim.js si hay data/ y core/; si no, uno falso con la forma de §15.2.
let simReal = null, datosReal = null;
try {
  const [m, d] = await Promise.all([import('../js/core/sim.js'), import('../js/data.js')]);
  datosReal = await d.cargarDatos('../'); simReal = m;
} catch (e) { console.warn('sin sim real', e); }
function registroReal(isla) {
  const ahora = reloj();
  const sps = lista.slice(0, 3);
  const save = { pokemon: sps.map((sp, i) => ({ id: 'd' + i, sp, nv: 5 + 8 * (isla - 1), est: 1, car: 30 })), islas: {}, base: { linterna: 3 * isla }, faro: 'norte', stats: { exps: 5 }, tutorial: {} };
  const F = (datosReal.islas.find(x => x.id === isla) || {}).F || 8;
  const plan = { equipo: ['d0', 'd1', 'd2'], roles: ['lider', 'expl', 'apoyo'], isla, modo: 'vuelta', hasta: F, postura: 'equilibrada', dominio: 0 };
  const snapshot = simReal.crearSnapshot(save, plan, datosReal);
  const registro = simReal.resolverExpedicion({ plan, snapshot, semilla: (Math.random() * 1e9) | 0, inicio: ahora, ctx: { datos: datosReal, ahora, semana: 0, clima: {}, evento: null } });
  return { registro, snapshot, isla: datosReal.islas.find(x => x.id === isla) };
}
function registroFalso() {
  const inicio = reloj(), tPiso = 9000, F = 8, pv = 3;
  const r1 = { t0: inicio, t1: inicio + tPiso * F, pisoFin: F, jefe: true, pvFin: 2, monedas: 0, exp: 0, objetos: {}, encuentros: [], eventos: [], fallos: [3] };
  return { v: 1, semilla: (Math.random() * 1e9) | 0, inicio, fin: r1.t1, tPiso, pvInicio: pv, rondas: [r1], motivo: 'objetivo', totales: {} };
}
const combate = Combate.crear($('combate'), { reloj });
const equipo = () => lista.slice(0, 3).map(sp => ({ sp, vr: false }));
function nuevaExp(i) {
  if (simReal) { try { const r = registroReal(i + 1 > 8 ? 1 : i + 1); combate.actualizar(r); log(`isla ${r.isla.n} · F ${r.registro.F} · ${r.registro.motivo}`); return; } catch (e) { console.warn(e); } }
  combate.actualizar({ registro: registroFalso(), snapshot: { miembros: equipo() }, isla: { clave: islas[i], F: 8 } });
  log('isla (falsa): ' + islas[i]);
}
nuevaExp(0);
const islas = ['prado', 'arroyo', 'cueva', 'bosque', 'volcan', 'pico', 'ruinas', 'cumbre', 'misterio'];
let ii = 0;
$('nuevaExp').onclick = () => { ii = (ii + 1) % 8; t0Juego = reloj(); t0Real = Date.now(); nuevaExp(ii); };
$('rapido').onclick = e => { t0Juego = reloj(); t0Real = Date.now(); vel = vel === 1 ? 20 : 1; e.target.textContent = vel === 1 ? '×20 velocidad' : '×1 velocidad'; };

// ---- Ficha
const ficha = Ficha.crear($('ficha'));
for (const sp of lista) { const o = document.createElement('option'); o.value = o.textContent = sp; $('esp').append(o); }
const ponFicha = () => { ficha.actualizar({ sp: $('esp').value, vr: $('vr').checked }); $('nomAnim').textContent = ficha.estado().anim; };
$('esp').onchange = ponFicha; $('vr').onchange = ponFicha;
$('ant').onclick = () => { $('nomAnim').textContent = ficha.cambiarAnim(-1); };
$('sig').onclick = () => { $('nomAnim').textContent = ficha.cambiarAnim(1); };
ficha.alTocar(i => log('ficha: ' + JSON.stringify(i)));
ponFicha();

// ---- Efectos (canvas propio mientras duran)
const fxc = $('fx');
$('evo').onclick = async () => { const a = lista[0], b = lista[1] || lista[0]; log('evolución…'); await fx.secuenciaEvolucion(fxc, a, b, false); log(`¡${a} se ha convertido en ${b}!`); };
$('vario').onclick = async () => { log('variocolor…'); await fx.revelarVario(fxc, lista[3 % lista.length]); log('¡Variocolor!'); };
$('compartir').onclick = async () => { const b = await fx.capturaCompartir(fxc, 'Prueba de captura'); window.open(URL.createObjectURL(b)); };

// ---- Bucle único (como main.js): llama a render(t) de las escenas visibles.
const escenas = [cala, combate, ficha];
escenas.forEach(e => e.iniciar());
function bucle(t) { for (const e of escenas) e.render(t); requestAnimationFrame(bucle); }
requestAnimationFrame(bucle);
window.__gfx = { S, cala, combate, ficha };
</script>
</body>
</html>
